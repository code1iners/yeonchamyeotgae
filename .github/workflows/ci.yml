# 커밋마다 지원 대상인 macOS에서 검증만 돈다. 패키징(electron-builder)은
# release.yml의 몫이다 — 여기서 부르면 Electron 배포본을 매 커밋 내려받는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      # fetch-depth는 기본값 — CI는 turbo 캐시에 기대지 않으므로 조정할 이유가 없다(스펙 9절 1번).
      - uses: actions/checkout@v7
      # install: false — pnpm의 CI 자동 감지에 맡기지 않고 --frozen-lockfile을
      # 손으로 적어 로그에 보이게 한다(스펙 8.6절).
      # version 입력은 적지 않는다 — 루트 package.json의 packageManager(pnpm@11.24.0)와
      # 병존하면 pnpm/setup@v2가 "Multiple versions of pnpm specified"로 실패한다
      # (run 32944881644 실측). 버전 고정은 packageManager의 정확 핀이 대신한다.
      - uses: pnpm/setup@v2
        with: { runtime: node@24, cache: true, install: false }
      - run: pnpm install --frozen-lockfile
      # turbo 캐시(actions/cache의 .turbo, 원격 캐시)는 붙이지 않는다 — 매번 새 러너에서
      # 검증과 캐시의 비용·결과를 분리해 결정론적인 제품 검증 로그를 남긴다(스펙 8.2절).
      - run: pnpm verify:product
      - run: pnpm build
