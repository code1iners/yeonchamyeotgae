appId: dev.yeoncha.desktop
# 사용자에게 보이는 이름(메뉴 막대·시작 메뉴·DMG 볼륨)은 한국어를 유지한다.
productName: 연차몇개
# 파일 이름은 ASCII로 뽑는다 — 기본 매크로가 다운로드 파일명이 되면
# 릴리스 URL이 퍼센트 인코딩으로 덮인다(스펙 8.3절).
executableName: yeonchamyeotgae
artifactName: "yeonchamyeotgae-${version}-${arch}.${ext}"
# mac 헬퍼 이름의 NFD/NFC 불일치를 고친다 — 없으면 패키징된 앱이 시작 직후
# 무음 SIGTRAP으로 죽는다. 상세는 훅 파일 주석에.
afterPack: scripts/fix-helper-nfd.cjs
directories:
  # out/(electron-vite 빌드)과 갈라져 있어야 한다 — 같은 디렉터리를 쓰면
  # asar가 이전 산출물을 자기 안에 삼킨다.
  output: release
files:
  - out/**
mac:
  # 기본 타깃이 dmg + zip인데 zip의 유일한 용도(자동 업데이트)가 Out of Scope다.
  # arm64만 — macos-latest 러너가 arm64이고 x64 사용자가 없다(스펙 8.3절).
  target:
    - target: dmg
      arch: [arm64]
  # 서명 억제(스펙 8.4절). identity: null이어야 키체인 조회 자체가 일어나지 않는다.
  # 인증서를 꽂을 때 이 줄을 지운다.
  identity: null
  hardenedRuntime: false
dmg:
  # 볼륨 이름 기본값은 productName이 아니라 productFilename에서 오는데,
  # executableName을 두면 productFilename이 ASCII가 된다(appInfo.js).
  # 사용자가 보는 볼륨 이름은 한국어여야 하므로 명시한다.
  title: "${productName} ${version}"
  # 기본 HFS+는 파일명을 NFD로 강제 정규화해 afterPack 훅이 고친 헬퍼
  # 이름을 되돌린다 — 설치본이 다시 SIGTRAP으로 죽는다. APFS는 NFC를
  # 보존한다. 최소 지원(macOS 13)이 APFS 요건(10.13+)을 넉넉히 넘고,
  # electron-builder도 다음 메이저에서 APFS를 기본값으로 예고했다.
  filesystem: APFS
win:
  # portable이 아니다 — 저장 파일이 userData 고정이라 portable exe는
  # 실제로 portable하지 않다. oneClick: true 기본값을 그대로 쓴다.
  # arch를 명시하지 않으면 호스트 아키텍처를 따라가 로컬(arm64)에서 arm64 exe가 나온다.
  # 릴리스 자산은 x64 하나다(스펙 8.3절).
  target:
    - target: nsis
      arch: [x64]
  # signAndEditExecutable: false가 아니다 — 그쪽은 아이콘 리소스 편집까지 꺼진다.
  signExecutable: false
