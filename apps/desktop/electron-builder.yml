appId: dev.yeoncha.desktop
# productName은 파일명 안전(ASCII)이어야 한다 — macOS 헬퍼 번들(Contents/Frameworks/*.app)
# 이름이 여기서만 파생되고 executableName으로 대체할 수 없다. 한글을 쓰면 Finder 복사
# (DMG → 응용 프로그램) 후 헬퍼 실행 파일 이름의 유니코드 정규화(NFC/NFD)가 Info.plist의
# CFBundleExecutable과 어긋나 앱이 실행 직후 SIGTRAP으로 죽는다 — 빌드 시점 훅으로는
# 고칠 수 없는 설치 시점 문제다. 앱 본체는 mac.executableName에서 별도로 파생돼 한글로
# 되돌려도 안전하다(아래 참고). 전체 조사는 스펙 8.3절과 31번 티켓을 본다.
productName: yeonchamyeotgae
artifactName: "yeonchamyeotgae-${version}-${arch}.${ext}"
# mac.identity: null이 코드 서명 자체를 건너뛰어 .app 번들에 서명 봉인이 없는 상태로
# 나가고 있었다(32번 티켓) — 격리 속성이 붙는 실제 다운로드에서 "손상됨"으로 거부된다.
# 이 훅이 패키징 직후 ad-hoc 서명으로 봉인을 채운다. 상세는 훅 파일 주석에.
afterPack: scripts/adhoc-sign.cjs
directories:
  # out/(electron-vite 빌드)과 갈라져 있어야 한다 — 같은 디렉터리를 쓰면
  # asar가 이전 산출물을 자기 안에 삼킨다.
  output: release
files:
  - out/**
mac:
  # 앱 본체는 productName이 아니라 이 값에서 파생된다(헬퍼와는 분리된 경로) — 그래서
  # 한글로 되돌려도 헬퍼 쪽 SIGTRAP 버그와는 무관하다. 단, Finder 복사 시 이 실행 파일도
  # 헬퍼와 같은 NFD 재정규화를 겪어 CFBundleExecutable(NFC)과 바이트가 어긋난다 — 그런데도
  # 크래시가 없는 이유는 "이미 떠 있는 메인 프로세스는 자기 실행 경로를 재검증하지 않는다"는
  # 관찰 하나에 기댄 것으로, Electron/Chromium/macOS가 바뀌면 조용히 재발할 수 있는 가정이다.
  # 재발 시 첫 확인 지점은 이 파일과 31번 티켓. mac 전용 — win은 무관하다.
  executableName: &koreanDisplayName 연차몇개
  # 기본 타깃이 dmg + zip인데 zip의 유일한 용도(자동 업데이트)가 Out of Scope다.
  # arm64만 — macos-latest 러너가 arm64이고 x64 사용자가 없다(스펙 8.3절).
  target:
    - target: dmg
      arch: [arm64]
  extendInfo:
    # CFBundleName이 productName(ASCII)에서 채워지는 부작용을 보완한다 — 강제 종료·Activity
    # Monitor가 쓰는 NSRunningApplication.localizedName은 이 값을 돌려준다(31번 티켓 실측).
    CFBundleDisplayName: *koreanDisplayName
  # 서명 억제(스펙 8.4절). identity: null이어야 키체인 조회 자체가 일어나지 않는다.
  # 인증서를 꽂을 때 이 줄을 지운다.
  identity: null
  hardenedRuntime: false
dmg:
  # productName이 ASCII라 매크로로는 한글 볼륨 이름이 안 나온다 — 리터럴로 적는다.
  title: "연차몇개 ${version}"
win:
  # portable이 아니다 — 저장 파일이 userData 고정이라 portable exe는
  # 실제로 portable하지 않다. oneClick: true 기본값을 그대로 쓴다.
  # arch를 명시하지 않으면 호스트 아키텍처를 따라가 로컬(arm64)에서 arm64 exe가 나온다.
  # 릴리스 자산은 x64 하나다(스펙 8.3절).
  target:
    - target: nsis
      arch: [x64]
  # signAndEditExecutable: false가 아니다 — 그쪽은 아이콘 리소스 편집까지 꺼진다.
  signExecutable: false
nsis:
  # 시작 메뉴·바탕화면 바로가기 이름. 기본값은 productName인데 그게 ASCII라
  # (위 참고) 명시하지 않으면 시작 메뉴에 "yeonchamyeotgae"가 뜬다.
  shortcutName: *koreanDisplayName
