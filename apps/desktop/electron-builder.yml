appId: dev.yeoncha.desktop
# productName은 파일명 안전(ASCII)이어야 한다. macOS 헬퍼 앱(Contents/Frameworks/*.app,
# 그 안의 실행 파일)의 이름이 여기서 곧이곧대로 파생되는데, electron-builder는 이 파생을
# productName에서 직접 하고 executableName으로 대신할 수 없다(31번 티켓). 한글을 쓰면
# 정상적인 Finder 복사(DMG → 응용 프로그램)에서조차 헬퍼 실행 파일 이름의 유니코드 표현이
# 바뀌어(NFC↔NFD) Info.plist의 CFBundleExecutable과 어긋나고, 앱이 실행 직후
# SIGTRAP(종료 코드 133)으로 죽는다 — 사용자가 설치 *이후에* 매번 새로 만드는 문제라
# 빌드 시점 훅으로는 고칠 수 없다.
#
# mac 앱 본체(.app 폴더 이름·그 안의 실행 파일)는 이 값이 아니라 mac.executableName에서
# 따로 파생된다 — 그래서 앱 본체는 한글로 되돌려도 안전하다(아래 mac.executableName 참고).
# CFBundleName이 ASCII가 되는 부작용은 mac.extendInfo.CFBundleDisplayName으로 메운다.
productName: yeonchamyeotgae
artifactName: "yeonchamyeotgae-${version}-${arch}.${ext}"
directories:
  # out/(electron-vite 빌드)과 갈라져 있어야 한다 — 같은 디렉터리를 쓰면
  # asar가 이전 산출물을 자기 안에 삼킨다.
  output: release
files:
  - out/**
mac:
  # 앱 본체(.app 폴더 이름·Contents/MacOS의 실행 파일·CFBundleExecutable)는 productName이
  # 아니라 이 값에서 파생된다(appInfo.js의 productFilename) — 헬퍼 이름(productName에서
  # 고정 파생, 위 참고)과는 완전히 분리된 경로라 여기만 한글로 되돌려도 헬퍼 쪽 SIGTRAP
  # 버그가 재발하지 않는다.
  #
  # 실측(31번 티켓): Finder로 복사하면 이 실행 파일도 헬퍼와 똑같이 NFD로
  # 재정규화되어 Info.plist의 CFBundleExecutable(NFC)과 바이트가 어긋난다. 그런데도
  # `open`/더블클릭으로 정상 실행되고 크래시가 없다 — 이미 떠 있는 메인 프로세스는
  # 자기 실행 파일 경로를 Info.plist와 다시 대조하지 않기 때문이다(헬퍼는 Chromium이
  # 내부적으로 그 대조를 해서 실패한다 — 이게 원래 SIGTRAP의 진짜 원인이었다).
  # mac 전용으로만 둔다 — win은 이 문제와 무관하고 건드릴 이유가 없다.
  executableName: 연차몇개
  # 기본 타깃이 dmg + zip인데 zip의 유일한 용도(자동 업데이트)가 Out of Scope다.
  # arm64만 — macos-latest 러너가 arm64이고 x64 사용자가 없다(스펙 8.3절).
  target:
    - target: dmg
      arch: [arm64]
  extendInfo:
    # 실측(31번 티켓): NSRunningApplication.localizedName(강제 종료·Activity Monitor)은
    # 이 값을 그대로 돌려준다 — CFBundleName이 ASCII인 것을 여기서 보완한다.
    CFBundleDisplayName: 연차몇개
  # 서명 억제(스펙 8.4절). identity: null이어야 키체인 조회 자체가 일어나지 않는다.
  # 인증서를 꽂을 때 이 줄을 지운다.
  identity: null
  hardenedRuntime: false
dmg:
  # productName이 ASCII라 매크로로는 한글 볼륨 이름이 안 나온다 — 리터럴로 적는다.
  title: "연차몇개 ${version}"
win:
  # portable이 아니다 — 저장 파일이 userData 고정이라 portable exe는
  # 실제로 portable하지 않다. oneClick: true 기본값을 그대로 쓴다.
  # arch를 명시하지 않으면 호스트 아키텍처를 따라가 로컬(arm64)에서 arm64 exe가 나온다.
  # 릴리스 자산은 x64 하나다(스펙 8.3절).
  target:
    - target: nsis
      arch: [x64]
  # signAndEditExecutable: false가 아니다 — 그쪽은 아이콘 리소스 편집까지 꺼진다.
  signExecutable: false
nsis:
  # 시작 메뉴·바탕화면 바로가기 이름. 기본값은 productName인데 그게 ASCII라
  # (위 참고) 명시하지 않으면 시작 메뉴에 "yeonchamyeotgae"가 뜬다.
  shortcutName: 연차몇개
